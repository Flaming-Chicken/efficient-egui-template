[workspace]
resolver = "3"
members = [
    "crates/app",
    "crates/shared",
    "crates/desktop",
    "crates/web",
]

# Shared metadata for all workspace packages
[workspace.package]
version = "0.1.0"
authors = ["Template Contributors <https://github.com/Flaming-Chicken>"]
edition = "2024"
license = "MIT OR Apache-2.0"
readme = "README.md"
description = "Modern, modular Serverless (WASM/Cloudflare Pages) & Native Desktop template built with Rust and egui"
repository = "https://github.com/Flaming-Chicken/efficient-egui-template"

[workspace.dependencies]
eframe = { version = "0.36", default-features = false, features = ["default_fonts"] }
egui = { version = "0.36", default-features = false, features = ["default_fonts"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "ansi", "tracing-log"] }
tracing-web = "0.1"

shared = { path = "crates/shared" }
app = { path = "crates/app" }
thiserror = "2.0"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Document", "Window", "HtmlCanvasElement", "Element", "Blob", "BlobPropertyBag", "Url", "HtmlAnchorElement", "HtmlDocument", "Location"] }
js-sys = "0.3"
console_error_panic_hook = "0.1.7"
bson = "2"
miniz_oxide = "0.8"
base64 = "0.22"
ron = "0.12"
criterion = "0.5"
wasm-bindgen-test = "0.3"
winit = { version = "0.30", default-features = false }
android-activity = { version = "0.6", default-features = false, features = ["native-activity"] }
spodeian-cache = { git = "https://github.com/Flaming-Chicken/spodeian-core", branch = "dev", version = "^1.0.0" }
spodeian-tokens = { git = "https://github.com/Flaming-Chicken/spodeian-core", branch = "dev", version = "^1.0.0" }
spodeian-telemetry = { git = "https://github.com/Flaming-Chicken/spodeian-core", branch = "dev", version = "^1.0.0" }
spodeian-export = { git = "https://github.com/Flaming-Chicken/spodeian-core", branch = "dev", version = "^1.0.0" }
spodeian-web-utils = { git = "https://github.com/Flaming-Chicken/spodeian-core", branch = "dev", version = "^1.0.0" }
spodeian-ui = { git = "https://github.com/Flaming-Chicken/spodeian-core", branch = "dev", version = "^1.0.0" }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
overflow-checks = false
incremental = false
rpath = false

[profile.release.build-override]
opt-level = 2
codegen-units = 256

[profile.bench]
opt-level = 3
lto = "fat"
codegen-units = 1
debug = false
overflow-checks = false
incremental = false

[profile.dev]
opt-level = 0
codegen-units = 256
debug = true

[profile.dev.build-override]
opt-level = 2
overflow-checks = false

[profile.test]
opt-level = 2
lto = "thin"
debug = true
